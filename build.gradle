plugins { id 'java' }
repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}
def runeLiteVersion = findProperty('runeliteVersion') ?: '1.13.3'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}
group = 'com.buildplanner'
version = '0.1.6-beta'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
test { systemProperty 'java.awt.headless', 'true' }
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.buildplanner.BuildPlannerLauncher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}
