name: Suggest a feature
description: Share an idea for improving Build Planner.
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Build Planner. Please check existing issues for a similar suggestion first."
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to add or change?
      description: Describe your idea in your own words.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would this help you?
      description: An example of when you would use it is helpful.
    validations:
      required: true
