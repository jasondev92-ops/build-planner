name: Report a bug
description: Tell us about something that is not working correctly.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please check existing issues first. Reports are public: do not include login details, bank PINs or other private information."
  - type: input
    id: version
    attributes:
      label: Build Planner version
      description: Find this in the plugin's Info tab.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What were you doing?
      description: List the steps that led to the problem.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or extra details (optional)
      description: Crop or remove private information before attaching a screenshot.
